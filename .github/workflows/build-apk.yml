name: Build Elyramart Android APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: elyramart-android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project safely
        run: |
          flutter create --platforms=android --org com.elyramartbd --project-name elyramart /tmp/elyramart_android
          rm -rf android
          cp -R /tmp/elyramart_android/android ./android
          cp /tmp/elyramart_android/.metadata ./.metadata

      - name: Set Android minimum SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Validate Firebase Functions
        run: |
          node --check firebase/functions/index.js
          node --check firebase/functions/validation.js
          node --check firebase/functions/scripts/set-admin.js
          node --test firebase/functions/test/*.test.js
          node -e "for (const f of ['firebase.json','firestore.indexes.json','firebase/functions/package.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Play Store App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-Play-Store-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
