name: Build Elyramart Android APK and Play Store AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: elyramart-android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project safely
        run: |
          flutter create --platforms=android --org com.elyramartbd --project-name elyramart /tmp/elyramart_android
          rm -rf android
          cp -R /tmp/elyramart_android/android ./android
          cp /tmp/elyramart_android/.metadata ./.metadata

      - name: Set Android minimum SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Validate Firebase Functions
        run: |
          node --check firebase/functions/index.js
          node --check firebase/functions/validation.js
          node --check firebase/functions/scripts/set-admin.js
          node --test firebase/functions/test/*.test.js
          node -e "for (const f of ['firebase.json','firestore.indexes.json','firebase/functions/package.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure Play Store release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'val keystoreProperties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
              s = s.replace('android {', '''
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          android {
          ''', 1)
              s = s.replace('buildTypes {', '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
              buildTypes {
          ''', 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
              p.write_text(s)
          PYCODE

      - name: Build signed Play Store App Bundle
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        run: flutter build appbundle --release

      - name: Upload signed AAB artifact
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-Play-Store-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Explain missing Play signing secrets
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' || secrets.ANDROID_KEY_ALIAS == '' || secrets.ANDROID_KEYSTORE_PASSWORD == '' || secrets.ANDROID_KEY_PASSWORD == '' }}
        run: echo "APK can be built, but Play Store AAB was skipped because release signing secrets are not configured."
